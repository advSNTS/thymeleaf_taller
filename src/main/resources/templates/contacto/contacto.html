<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Contacto - Diomedes Style</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/contacto.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<form id="formularioContacto" th:action="@{/contacto}" th:object="${contacto}" method="post">

    <h2>Formulario de Contacto</h2>
    <div id="mensaje-exito" style="display:none; background:#d4edda; color:#155724; padding:1rem; border-radius:6px; margin-bottom:1rem;">
        ¡Tu mensaje fue enviado correctamente!
    </div>

    <fieldset>
        <legend>INFORMACIÓN BÁSICA</legend>

        <div class="form_input">
            <label>Nombre Completo</label>
            <input type="text" placeholder="Diomedes Diaz"
                   th:field="*{nombre}">
        </div>

        <div class="form_input">
            <label>Email</label>
            <input type="email" placeholder="aydiome@gmail.com"
                   th:field="*{email}">
        </div>

        <div class="form_input">
            <label>Teléfono</label>
            <input type="text" placeholder="3001234567"
                   th:field="*{telefono}">
        </div>

        <div class="form_input">
            <label>Asunto o motivo</label>
            <select th:field="*{asunto}">
                <option value="">Seleccione una opción</option>
                <option value="contratacion">Contratación para parranda</option>
                <option value="saludo">Enviar un saludo</option>
                <option value="otro">Olvidarte es imposible (Otros)</option>
            </select>
        </div>
    </fieldset>

    <div class="form_input">
        <label>Tipo de usuario</label>
        <select th:field="*{tipoUsuario}">
            <option value="Seguidor">Seguidor/a</option>
            <option value="Empresa">Empresa</option>
            <option value="Otros">Otros</option>
        </select>
    </div>

    <div class="form_input">
        <label>Referente</label>
        <input list="referente"
               th:field="*{referente}">
        <datalist id="referente">
            <option value="Un amigo">
            <option value="Una empresa">
            <option value="Otro">
        </datalist>
    </div>

    <div class="form_input">
        <label>Mensaje</label>
        <textarea rows="8"
                  placeholder="Deja tu mensaje..."
                  th:field="*{mensaje}"></textarea>
    </div>

    <div class="form_input checkbox_group">
        <input type="checkbox"
               class="checkbox"
               th:field="*{terminos}">
        <label>
            Acepto los términos y condiciones
        </label>
    </div>

    <div class="form_input form_actions">
        <button type="submit">Enviar mensaje</button>
    </div>

</form>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
