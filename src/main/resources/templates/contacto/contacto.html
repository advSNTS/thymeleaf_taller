<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Contacto - Diomedes Style</title>
        <link rel="stylesheet" th:href="@{/css/main.css}">
        <link rel="stylesheet" th:href="@{/css/contacto.css}">
        <style>
            /* Un poco de estilo rápido para los errores, puedes moverlo a tu contacto.css */
            .error-mensaje {
                color: #e74c3c;
                font-size: 0.85rem;
                margin-top: 5px;
                display: block;
                min-height: 1.2em;
            }
            #contador-caracteres {
                font-size: 0.85rem;
                color: #666;
                display: block;
                margin-top: 5px;
            }
        </style>
    </head>
    <body>

        <div th:replace="~{fragments/header :: header}"></div>

        <form id="formularioContacto" 
              th:action="@{/contacto}" 
                th:object="${contacto}" 
                   method="post"
                      novalidate>
            <h2>Formulario de Contacto</h2>

            <fieldset>
                <legend>INFORMACIÓN BÁSICA</legend>
                
                <div class="form_input">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" th:field="*{nombre}" placeholder="Diomedes Diaz">
                    <span class="error-mensaje" id="error-nombre"></span>
                </div>

                <div class="form_input">
                    <label for="email">Email</label>
                    <input type="email" th:field="*{correo}" placeholder="aydiome@gmail.com">
                    <span class="error-mensaje" id="error-email"></span>
                </div>

                <div class="form_input">
                    <label for="telefono">Teléfono</label>
                    <input type="text" th:field="*{telefono}" placeholder="3001234567">
                    <span class="error-mensaje" id="error-telefono"></span>
                </div>

                <div class="form_input">
                    <label for="asunto">Asunto o motivo</label>
                    <select id="asunto" th:field="*{asunto}" name="asunto">
                        <option value="">Seleccione una opción</option>
                        <option value="contratacion">Contratación para parranda</option>
                        <option value="saludo">Enviar un saludo</option>
                        <option value="otro">Olvidarte es imposible (Otros)</option>
                    </select>
                    <span class="error-mensaje" id="error-asunto"></span>
                </div>
            </fieldset>

            <div class="form_input">
                <label for="tipoUsuario">Tipo de usuario</label>
                <select name="type-of-user" id="tipoUsuario" th:field="*{tipoUsuario}">
                    <option value="user1">Seguidor/a</option>
                    <option value="user2">Empresa</option>
                    <option value="user3">Otros</option>
                </select>
            </div>
            
            <div class="form_input">
                <label for="referente_input">Referente</label>
                <input list="referente" name="referente" id="referente_input" th:field="*{referente}">
                <datalist id="referente">
                    <option value="Un amigo">Un compañero y/o persona</option>
                    <option value="Una empresa">Organización u organismo</option>
                    <option value="Otro">Otros</option>
                </datalist>
            </div>

            <div class="form_input">
                <label for="mensaje">Mensaje</label>
                <textarea rows="8" placeholder="Deja tu mensaje..." id="mensaje"name="mensaje" th:field="*{mensaje}"></textarea>
                <span id="contador-caracteres">Faltan 20 caracteres para el mínimo.</span>
                <span class="error-mensaje" id="error-mensaje"></span>
            </div>

            <div class="form_input checkbox_group">
                <input type="checkbox" class="checkbox" id="terminos">
                <label for="terminos">
                    Acepto los 
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" 
                       target="_blank" 
                       rel="noopener noreferrer">términos y condiciones</a>
                </label>
                <span class="error-mensaje" id="error-terminos"></span>
            </div>

            <div class="form_input form_actions">
                <button type="submit">Enviar mensaje</button>
            </div>
        </form>

        <div th:replace="~{fragments/footer :: footer}"></div>

        <script th:src="@{/js/validaciones.js}"></script>
    </body>
</html>
